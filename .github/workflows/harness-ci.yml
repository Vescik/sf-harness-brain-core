name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate brain-core contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 20, not 15: the budget step builds a 3000-entry fixture and spawns 21 cold probe
    # processes per budgeted command (fewer than 21 and the reported p95 is just a maximum,
    # which is how this gate came to fail on one noisy sample). windows-latest pays NTFS +
    # Defender on every file of that fixture and on every process spawn.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install validation dependencies
        # --require-hashes verifies every downloaded artifact against the pinned sha256 set,
        # defeating index-substitution / version-hijack (matters most for the rpds-py binary wheel).
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version-file: .nvmrc

      - name: Install pinned Salesforce review runtime
        run: npm ci --ignore-scripts

      - name: Audit npm dependency tree
        # Hard-fail only on CRITICAL advisories in the production tree. The @salesforce/mcp
        # transitive tree currently carries lower-severity advisories that are not fixable from
        # here (pinned upstream); Dependabot surfaces and proposes fixes for those separately.
        run: npm audit --omit=dev --audit-level=critical

      - name: Compile Python controls
        run: python -m compileall -q scripts tests

      - name: Parse Salesforce MCP launcher
        run: |
          node --check scripts/start_salesforce_mcp.mjs
          node --check scripts/salesforce_review_server.mjs

      - name: Validate harness structure and contracts
        run: python scripts/validate_harness.py

      - name: Validate knowledge registry contract and index drift
        # validate_harness.py already runs these as grounding checks; the explicit step makes a
        # knowledge-store failure attributable in the CI log instead of a generic harness error.
        run: |
          python scripts/knowledge_registry.py validate
          python scripts/knowledge_registry.py render-indexes --check
          python scripts/knowledge_store.py entry-check
          python scripts/knowledge_search.py build

      - name: Knowledge search freshness floor and per-traversal budgets
        # Every knowledge_search invocation pays the freshness floor before any query work, and
        # it grows with the corpus -- so the per-entry cost is what is budgeted, not a time at
        # one fixture size (which any budget could meet by running the benchmark smaller). The
        # per-command ceilings (R4: absolute latency AND memory for every traversal) live in
        # knowledge_benchmark.TRAVERSAL_BUDGETS, next to the measurement that justifies them,
        # rather than here where they would drift away from it.
        #
        # Everything is measured COLD, in fresh subprocesses: these are per-CLI-process costs,
        # and the peak RSS of a warm benchmark process would be dominated by fixture writing
        # and the index build rather than by the command a user runs.
        #
        # THE MEMORY HALF, AND WHAT IS ACTUALLY PROVEN. --assert-command-budgets now covers all
        # five traversals the plan names, INCLUDING the freshness floor: §4.2 asks for a
        # `peakRssMb` that is "budgeted, not merely measured", and the floor's peak was measured
        # and printed by every run while being asserted by nothing. Its ceiling is
        # FLOOR_BUDGET = 80 MB, from 26.6-27.2 MB measured over 102 fresh corpus_fingerprint
        # processes at 3000 entries, plus headroom for the 44.7-48.1 MB a process pays when it
        # has to compile the imported modules itself -- which is why the "Compile Python
        # controls" step above matters to this one: it warms __pycache__, and without it the
        # first cold probe process carries the CPython compiler.
        #
        # What is NOT proven: every one of those numbers is macOS, and on windows-latest the
        # instrument itself is different code --
        # `resource` does not exist there, so peak RSS comes from a ctypes call into
        # kernel32.K32GetProcessMemoryInfo. That branch is exercised by unit test with a doubled
        # kernel32 (structure layout, argtypes/restype declarations and the byte->MB conversion
        # all execute), but it has never run against a real Windows kernel. Until a green
        # windows-latest leg reports `peakRssSource: kernel32.K32GetProcessMemoryInfo ...`, treat
        # every memory ceiling here as verified off-platform; a leg that instead logs
        # "MEMORY UNMEASURED" is the signal that the instrument failed and the latency gate ran
        # alone.
        #
        # WHY 5.0 AND NOT THE PLAN'S 2.67, AND WHY IT IS NOT A p95 -- A STATED DEVIATION, NOT
        # COMPLIANCE. 2.67 us/entry is master-plan §4.2's 40 ms at 15 k (40000 / 15000), and as
        # shipped it failed 2 of 3 verification runs on the developer's own machine before ever
        # reaching the slower windows-latest leg. Measured on this repo's 3000-entry fixture
        # (macOS 15 / APFS, Apple silicon, Python 3.12, cold first call in a fresh process,
        # marginal per-entry cost with the fixed code_fingerprint term subtracted):
        #   * p95 of 21 cold samples: 2.65-7.00 across 5 runs under normal developer load
        #     (load average 5-10 on 10 cores), and 11.22 on a sixth -- an unchanged corpus and
        #     unchanged code whose 20th-of-21 sample was 34.0 ms against a median of 11.2 ms;
        #   * pooled p95 over 105 cold samples: 6.26 and 7.18 under the same load;
        #   * best-of-21 (the NOISE FLOOR, machine noise removed): 2.35-3.66 across every run
        #     above, and 2.45-2.65 on an idle machine.
        # A p95 over cold processes on a shared runner measures the runner's tail; the minimum
        # moves only when the code does. So the gate asserts the noise floor -- that is the
        # deviation from §4.2's wording, and the p95 is still reported per run in
        # `floorBudget.p95PerEntryMicroseconds` so a red build can be read as one or the other.
        # 5.0 us/entry is ~1.4x the worst noise-floor sample measured and projects to ~75 ms at
        # 15 k against the plan's 40 ms. Cheapening the sweep was tried first and the headroom
        # is not there -- the per-file `stat` is one `fstatat` already, and the only 5x cheaper
        # form (directory mtimes alone, measured 0.53 us/entry) stops seeing an in-place content
        # edit, which hydration cannot catch because it only re-verifies rows a query SERVES.
        # The gate keeps its teeth: the pre-P2 rglob+stat sweep this replaced measured
        # 11.6 us/entry on a quiet machine, so a return to it fails here under any load.
        #
        # This runs on the matrix, so windows-latest is where the number that matters is
        # measured: the team is Windows-only, and NTFS plus Defender make directory sweeps and
        # process spawns materially slower than the macOS figures above. The first green
        # windows-latest runs are the measurement that should tighten every number here.
        run: >-
          python scripts/knowledge_benchmark.py --entries 3000 --repeats 5
          --assert-floor-us 5.0 --assert-command-budgets

      - name: Report knowledge freshness (advisory)
        # Advisory only: expired/expiring claims are surfaced in the log for re-review
        # scheduling but never fail CI. A corrupt store already fails the validate step above.
        run: python scripts/knowledge_registry.py stale-report

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic safety evaluations
        run: python scripts/run_evals.py

      - name: Validate embedded Salesforce project tooling
        run: |
          npm run prettier:verify
          npm run lint
          npm run test:unit:ci

      - name: Confirm local and generated state is ignored
        shell: bash
        run: |
          # git check-ignore exits 0 if ANY argument is ignored, so check each path individually
          # to catch a single path that stops being ignored.
          for path in \
            config/harness.local.json \
            config/harness.json \
            .cache/ado-items/example.json \
            output/handover/example.md \
            .env \
            force-app/main/default/lwc/jsconfig.json \
            deploy-options.json; do
            git check-ignore -q "$path" || { echo "NOT IGNORED: $path"; exit 1; }
          done
